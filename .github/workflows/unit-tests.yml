name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run --locked python -m unittest discover -s tests -q
