[project]
name = "balagh-community-triage"
version = "1.0.0"
description = "A local multi-agent community issue triage and routing system."
authors = [{ name = "Suliman Altayar" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.10,<2.0.0",
    "streamlit>=1.47.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
balagh = "balagh.launcher:run"
run_crew = "balagh.launcher:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balagh"]

[tool.crewai]
type = "crew"
