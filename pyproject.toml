[project]
name = "balagh-community-triage"
version = "2.0.2"
description = "A local human-in-the-loop community issue triage and agentic case coordination system."
authors = [{ name = "Suliman Altayar" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "flask>=3.1.0,<4.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "langsmith>=0.11.0,<1.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balagh"]
