<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}بوابة الموظف | بلاغ{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="staff-body">
    {% if session.get('staff_authenticated') %}
    <header class="staff-header">
        <a class="brand" href="{{ url_for('staff.dashboard') }}" aria-label="العودة إلى لوحة الموظف">
            <span class="brand-mark" aria-hidden="true">ب</span>
            <span>
                <strong>بلاغ</strong>
                <small>بوابة الموظف</small>
            </span>
        </a>
        <nav aria-label="تنقل بوابة الموظف">
            <a class="{{ 'active' if request.endpoint == 'staff.dashboard' else '' }}" href="{{ url_for('staff.dashboard') }}">لوحة التحكم</a>
            <a class="{{ 'active' if request.endpoint in ('staff.reports', 'staff.review') else '' }}" href="{{ url_for('staff.reports') }}">البلاغات</a>
        </nav>
        <form method="post" action="{{ url_for('staff.logout') }}">
            <button class="link-button" type="submit">تسجيل الخروج</button>
        </form>
    </header>
    {% endif %}

    <main class="{{ 'staff-shell' if session.get('staff_authenticated') else 'login-shell' }}">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert {{ category }}" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
